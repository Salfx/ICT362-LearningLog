
{% extends 'learning_logs/base.html' %}

{% block content %}

<h2>Topics</h2>

<p>Here are the topics I am learning about:</p>

<ul>
    {% for topic in topics %}
        <li>
            <a href="{% url 'learning_logs:topic_detail' topic.id %}">
                {{ topic.text }}
            </a>
        </li>
    {% empty %}
        <li>No topics have been added yet.</li>
    {% endfor %}
</ul>

{% endblock content %}
